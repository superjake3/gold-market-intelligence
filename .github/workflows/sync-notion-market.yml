name: Sync Notion Manual Market Entries
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync-notion-market.py"
      - ".github/workflows/sync-notion-market.yml"
    branches: [main]
permissions:
  contents: write
concurrency:
  group: notion-market-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read manual market entries from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: "70d8c1da-ef61-419b-ae8c-0ae3aa8d4a35"
        run: |
          python scripts/sync-notion-market.py
      - name: Publish dashboard data
        run: |
          if git diff --quiet -- data/notion-market.json; then
            echo "No Notion data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notion-market.json
          git commit -m "Sync manual Notion market entries"
          git push
