name: Update Live Market Quotes
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-market-quotes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch each market quote independently
        id: collect
        run: |
          python - <<'PY'
          import datetime, json, os, re, urllib.request
          from zoneinfo import ZoneInfo

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://stock.naver.com/"
          }

          def now_kst():
              return datetime.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds")

          def get_json(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=15) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}")
                  return json.loads(response.read().decode("utf-8-sig"))

          def find_value(obj, keys):
              if isinstance(obj, dict):
                  for key in keys:
                      if key in obj and obj[key] not in (None, ""):
                          return obj[key]
                  for value in obj.values():
                      found = find_value(value, keys)
                      if found not in (None, ""):
                          return found
              elif isinstance(obj, list):
                  for value in obj:
                      found = find_value(value, keys)
                      if found not in (None, ""):
                          return found
              return None

          def number(value):
              if value is None:
                  return None
              cleaned = re.sub(r"[^0-9.\\-]", "", str(value).replace(",", ""))
              try:
                  parsed = float(cleaned)
                  return parsed if parsed > 0 else None
              except (TypeError, ValueError):
                  return None

          sources = {
              "international_gold": "https://api.stock.naver.com/marketindex/metals/GCcv1",
              "domestic_gold": "https://api.stock.naver.com/marketindex/metals/M04020000",
              "usdkrw": "https://api.stock.naver.com/marketindex/exchange/FX_USDKRW"
          }

          os.makedirs("data", exist_ok=True)
          try:
              with open("data/live-market.json", encoding="utf-8") as existing_file:
                  output = json.load(existing_file)
          except (FileNotFoundError, json.JSONDecodeError):
              output = {}

          output.setdefault("source", "Naver Finance public market-index data")
          for name in sources:
              if not isinstance(output.get(name), dict):
                  output[name] = {}

          attempt_at = now_kst()
          errors = {}
          updated_names = []
          changed = False

          def parse_time(value):
              if not value:
                  return None
              try:
                  parsed = datetime.datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=ZoneInfo("Asia/Seoul"))
                  return parsed
              except (TypeError, ValueError):
                  return None

          for name, url in sources.items():
              previous = output.get(name) or {}
              try:
                  data = get_json(url)
                  price = number(find_value(data, ["closePrice"]))
                  if price is None:
                      raise RuntimeError("closePrice missing or invalid")
                  traded_at = find_value(data, ["localTradedAt", "localTradedAtString"])
                  status = find_value(data, ["marketStatus"])
                  status_text = str(status).strip().upper() if status is not None else ""
                  old_traded = parse_time(previous.get("localTradedAt"))
                  new_traded = parse_time(traded_at)
                  has_new_trade_time = bool(new_traded and (not old_traded or new_traded > old_traded))

                  # Each provider reports its own market status. Accept a quote while
                  # that market is open, or when its actual trade timestamp advances
                  # (for example, the final quote published at market close).
                  should_update_quote = (
                      status_text in ("OPEN", "TRADING", "CONTINUOUS")
                      or has_new_trade_time
                      or not previous.get("closePrice")
                  )

                  if should_update_quote:
                      output[name] = {
                          "closePrice": price,
                          "localTradedAt": traded_at,
                          "marketStatus": status,
                          "fetchedAt": attempt_at,
                          "lastCheckedAt": attempt_at
                      }
                      updated_names.append(name)
                      changed = True
                      print(f"UPDATED {name}: {price} @ {traded_at} ({status})")
                  else:
                      # Do not replace a closed market's last valid price with a
                      # stale quote. Still record a status transition if one occurs.
                      current = dict(previous)
                      if status is not None and current.get("marketStatus") != status:
                          current["marketStatus"] = status
                          current["statusCheckedAt"] = attempt_at
                          changed = True
                      output[name] = current
                      print(f"UNCHANGED {name}: keeping {current.get('closePrice')} @ {current.get('localTradedAt')} ({status})")
              except Exception as exc:
                  errors[name] = str(exc)
                  print(f"WARNING {name}: {exc}; keeping previous valid value")

          if output.get("errors", {}) != errors:
              output["errors"] = errors
              changed = True

          if updated_names:
              output["fetched_at"] = attempt_at

              # Keep an hourly snapshot with independent trade/fetch timestamps
              # for all three markets. Each quote retains its own market status.
              history_path = "data/live-market-history.json"
              try:
                  with open(history_path, encoding="utf-8") as history_file:
                      history = json.load(history_file)
              except (FileNotFoundError, json.JSONDecodeError):
                  history = {"source": "Naver Finance public market-index data", "records": []}

              record = {"captured_at": attempt_at}
              for name in sources:
                  quote = output.get(name) or {}
                  record[name] = {
                      "closePrice": quote.get("closePrice"),
                      "localTradedAt": quote.get("localTradedAt"),
                      "marketStatus": quote.get("marketStatus"),
                      "fetchedAt": quote.get("fetchedAt")
                  }

              records = history.get("records", [])
              records.append(record)
              history["records"] = records[-8760:]
              history["updated_at"] = attempt_at
              with open(history_path, "w", encoding="utf-8") as history_file:
                  json.dump(history, history_file, ensure_ascii=False, indent=2)
              print("Historical snapshot recorded.")

          if changed:
              output["last_attempt_at"] = attempt_at
              with open("data/live-market.json", "w", encoding="utf-8") as target:
                  json.dump(output, target, ensure_ascii=False, indent=2)
              print("Market snapshot updated.")
          else:
              print("No market is currently publishing a new quote; previous valid data remains unchanged.")

          if errors:
              print("SOURCE_ERRORS=" + json.dumps(errors, ensure_ascii=False))
      - name: Commit live market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-market.json
          if [ -f data/live-market-history.json ]; then git add data/live-market-history.json; fi
          if git diff --cached --quiet; then
            echo "No quote changes to publish."
            exit 0
          fi
          git commit -m "Update live market quotes"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 2
          done
          exit 1
