name: Update Live Market Quotes
on:
  schedule:
    # Every 5 minutes (UTC); GitHub Actions may start scheduled jobs a little late.
    - cron: "4-59/5 * * * *"
  push:
    paths:
      - ".github/workflows/update-live-market.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-market-quotes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch each market quote independently
        id: collect
        run: |
          python - <<'PY'
          import datetime, json, os, re, urllib.request
          from zoneinfo import ZoneInfo

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://stock.naver.com/"
          }

          def now_kst():
              return datetime.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds")

          def get_json(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=15) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}")
                  return json.loads(response.read().decode("utf-8-sig"))

          def find_value(obj, keys):
              if isinstance(obj, dict):
                  for key in keys:
                      if key in obj and obj[key] not in (None, ""):
                          return obj[key]
                  for value in obj.values():
                      found = find_value(value, keys)
                      if found not in (None, ""):
                          return found
              elif isinstance(obj, list):
                  for value in obj:
                      found = find_value(value, keys)
                      if found not in (None, ""):
                          return found
              return None

          def number(value):
              if value is None:
                  return None
              cleaned = re.sub(r"[^0-9.\\-]", "", str(value).replace(",", ""))
              try:
                  parsed = float(cleaned)
                  return parsed if parsed > 0 else None
              except (TypeError, ValueError):
                  return None

          sources = {
              "international_gold": "https://api.stock.naver.com/marketindex/metals/GCcv1",
              "domestic_gold": "https://api.stock.naver.com/marketindex/metals/M04020000",
              "usdkrw": "https://api.stock.naver.com/marketindex/exchange/FX_USDKRW"
          }

          os.makedirs("data", exist_ok=True)
          try:
              with open("data/live-market.json", encoding="utf-8") as existing_file:
                  output = json.load(existing_file)
          except (FileNotFoundError, json.JSONDecodeError):
              output = {}

          output.setdefault("source", "Naver Finance public market-index data")
          for name in sources:
              if not isinstance(output.get(name), dict):
                  output[name] = {}

          attempt_at = now_kst()
          errors = {}
          successes = []

          for name, url in sources.items():
              try:
                  data = get_json(url)
                  price = number(find_value(data, ["closePrice"]))
                  if price is None:
                      raise RuntimeError("closePrice missing or invalid")
                  traded_at = find_value(data, ["localTradedAt", "localTradedAtString"])
                  status = find_value(data, ["marketStatus"])
                  output[name] = {
                      "closePrice": price,
                      "localTradedAt": traded_at,
                      "marketStatus": status,
                      "fetchedAt": attempt_at
                  }
                  successes.append(name)
                  print(f"OK {name}: {price} @ {traded_at} ({status})")
              except Exception as exc:
                  errors[name] = str(exc)
                  print(f"WARNING {name}: {exc}; keeping previous valid value")

          output["last_attempt_at"] = attempt_at
          output["errors"] = errors
          if successes:
              output["fetched_at"] = attempt_at
              with open("data/live-market.json", "w", encoding="utf-8") as target:
                  json.dump(output, target, ensure_ascii=False, indent=2)
              print("Updated independently: " + ", ".join(successes))
          else:
              print("No source returned a valid quote. Existing published data is left untouched.")
              raise SystemExit("All quote sources failed; no snapshot was overwritten.")
          if errors:
              print("PARTIAL_UPDATE_ERRORS=" + json.dumps(errors, ensure_ascii=False))
          PY
      - name: Commit live market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-market.json
          if git diff --cached --quiet; then
            echo "No quote changes to publish."
            exit 0
          fi
          git commit -m "Update live market quotes"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 2
          done
          exit 1
