name: Update Live Market Quotes
on:
  push:
    paths:
      - ".github/workflows/update-live-market.yml"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: live-market-quotes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Naver market quotes
        run: |
          python - <<'PY'
          import datetime, json, re, urllib.request
          from zoneinfo import ZoneInfo

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://stock.naver.com/"
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=20) as r:
                  if r.status != 200:
                      raise RuntimeError(f"HTTP {r.status}: {url}")
                  return json.loads(r.read().decode("utf-8-sig"))

          def find_value(obj, keys):
              if isinstance(obj, dict):
                  for key in keys:
                      if key in obj and obj[key] not in (None, ""):
                          return obj[key]
                  for value in obj.values():
                      found = find_value(value, keys)
                      if found not in (None, ""):
                          return found
              elif isinstance(obj, list):
                  for value in obj:
                      found = find_value(value, keys)
                      if found not in (None, ""):
                          return found
              return None

          def number(value):
              if value is None:
                  return None
              s = re.sub(r"[^0-9.\\-]", "", str(value).replace(",", ""))
              try:
                  n = float(s)
                  return n if n > 0 else None
              except ValueError:
                  return None

          sources = {
              "international_gold": "https://api.stock.naver.com/marketindex/metals/GCcv1",
              "domestic_gold": "https://api.stock.naver.com/marketindex/metals/M04020000",
              "usdkrw": "https://api.stock.naver.com/marketindex/exchange/FX_USDKRW"
          }

          output = {
              "source": "Naver Finance public market-index data",
              "fetched_at": datetime.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
              "international_gold": {},
              "domestic_gold": {},
              "usdkrw": {}
          }

          errors = []
          for name, url in sources.items():
              try:
                  data = get_json(url)
                  price = number(find_value(data, ["closePrice"]))
                  if price is None:
                      raise RuntimeError("closePrice field missing or invalid")
                  traded_at = find_value(data, ["localTradedAt", "localTradedAtString"])
                  status = find_value(data, ["marketStatus"])
                  output[name] = {
                      "closePrice": price,
                      "localTradedAt": traded_at,
                      "marketStatus": status
                  }
                  print(f"{name}: {price} @ {traded_at} ({status})")
              except Exception as exc:
                  errors.append(f"{name}: {exc}")
                  print(f"ERROR {name}: {exc}")

          if errors:
              raise SystemExit("Live quote update failed; refusing to publish partial data: " + "; ".join(errors))

          with open("data/live-market.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print(json.dumps(output, ensure_ascii=False))
          PY
      - name: Commit live market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-market.json
          git diff --cached --quiet || (git commit -m "Update live market quotes" && git push)

